name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend with test dependencies
        run: pip install -e ".[test]"
      - name: Run backend tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run lint
      - name: Auth and navigation security tests
        run: pnpm run test:security
      - name: Build frontend
        run: pnpm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate generic Compose
        run: docker compose config --quiet
      - name: Validate Traefik Compose
        env:
          CLOUDSITE_DOMAIN: cloud.example.com
        run: docker compose -f docker-compose.traefik.yml config --quiet
      - name: Validate development Compose
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Validate offline Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.offline.yml config --quiet

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API and Web images
        run: docker compose -f docker-compose.dev.yml build
      - name: Start stack and wait for health
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: Verify API health and version
        run: |
          curl -fsS http://127.0.0.1:8000/api/health | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["status"]=="healthy"; print("api", d["version"])'
      - name: Verify Web responds
        run: curl -fsS -o /dev/null http://127.0.0.1:3000/
      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version consistency
        run: |
          if [[ "${{ github.ref_name }}" == v* ]]; then
            python scripts/check-release-version.py --tag "${{ github.ref_name }}"
          else
            python scripts/check-release-version.py
          fi

  dependency-audit:
    # 1.0 Supply Chain Gate: pip-audit + pnpm audit。
    # 当前以 informational 运行（continue-on-error），确认无高危后移除 continue-on-error 并加入 publish needs。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python dependency audit (pip-audit)
        working-directory: apps/api
        continue-on-error: true
        run: |
          pip install -e ".[test]"
          pip install pip-audit
          pip-audit --strict
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Node dependency audit (pnpm audit)
        working-directory: apps/web
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod

  publish:
    if: github.event_name != 'pull_request'
    needs: [backend, frontend, compose, docker-smoke, version-consistency]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    secrets: inherit

  release-offline:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          api = re.search(r'__version__ = "([^"]+)"', Path("apps/api/cloudsite/__init__.py").read_text()).group(1)
          web = json.loads(Path("apps/web/package.json").read_text())["version"]
          if api != expected or web != expected:
              raise SystemExit(f"release tag {expected} does not match api={api}, web={web}")
          PY
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build offline release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/CloudSite
          for arch in amd64 arm64; do
            for component in api web; do
              image="ghcr.io/${IMAGE_OWNER}/cloudsite-${component}:${RELEASE_TAG}"
              archive="artifacts/cloudsite-${component}-${RELEASE_TAG}-linux-${arch}.tar.gz"
              docker pull --platform "linux/${arch}" "$image"
              docker save "$image" | gzip -1 > "$archive"
              docker image rm "$image"
            done
          done
          cp docker-compose.yml docker-compose.offline.yml .env.example README.md LICENSE artifacts/CloudSite/
          cp -R scripts docs artifacts/CloudSite/
          (cd artifacts && zip -qr "cloudsite-${RELEASE_TAG}-offline-deploy.zip" CloudSite)
          (cd artifacts && sha256sum \
            "cloudsite-api-${RELEASE_TAG}-linux-amd64.tar.gz" \
            "cloudsite-api-${RELEASE_TAG}-linux-arm64.tar.gz" \
            "cloudsite-web-${RELEASE_TAG}-linux-amd64.tar.gz" \
            "cloudsite-web-${RELEASE_TAG}-linux-arm64.tar.gz" \
            "cloudsite-${RELEASE_TAG}-offline-deploy.zip" > SHA256SUMS.txt)
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt --generate-notes --verify-tag
          fi
