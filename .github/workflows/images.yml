name: Publish container images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloudsite-api
            context: ./apps/api
            platform: linux/amd64
            runner: ubuntu-latest
          - name: cloudsite-api
            context: ./apps/api
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: cloudsite-web
            context: ./apps/web
            platform: linux/amd64
            runner: ubuntu-latest
          - name: cloudsite-web
            context: ./apps/web
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/${{ matrix.name }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download cloudsite-api digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests/cloudsite-api
          pattern: digests-cloudsite-api-*
          merge-multiple: true

      - name: Download cloudsite-web digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests/cloudsite-web
          pattern: digests-cloudsite-web-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (cloudsite-api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudsite-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create multi-arch manifest (cloudsite-api)
        working-directory: ${{ runner.temp }}/digests/cloudsite-api
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/cloudsite-api@sha256:%s ' *)
        env:
          META_JSON: ${{ steps.meta-api.outputs.json }}

      - name: Extract image metadata (cloudsite-web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudsite-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create multi-arch manifest (cloudsite-web)
        working-directory: ${{ runner.temp }}/digests/cloudsite-web
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/cloudsite-web@sha256:%s ' *)
        env:
          META_JSON: ${{ steps.meta-web.outputs.json }}

      - name: Inspect images
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/cloudsite-api:${{ steps.meta-api.outputs.version }}
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/cloudsite-web:${{ steps.meta-web.outputs.version }}
