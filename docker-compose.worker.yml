# 独立 Worker Compose 覆盖文件。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d
#
# 说明：
# - 在基础 docker-compose.yml 之上追加一个 worker 服务。
# - Worker 复用 API 镜像，仅覆盖启动命令为 python -m cloudsite.worker_main。
# - 与 api 共享 data 卷，通过同一内部网络访问。
# - 不暴露任何端口；Worker 不提供 HTTP 服务。
# - 可通过 CLOUDSITE_WORKER_* 环境变量调整队列、轮询间隔与并发数。

services:
  worker:
    image: ${CLOUDSITE_API_IMAGE:-ghcr.io/nathanxiangang-web/cloudsite-api}:${CLOUDSITE_IMAGE_TAG:-v2.0.0-alpha.1}
    pull_policy: always
    command: ["python", "-m", "cloudsite.worker_main"]
    environment:
      CLOUDSITE_SECRET_KEY: "${CLOUDSITE_SECRET_KEY:?CLOUDSITE_SECRET_KEY is required}"
      CLOUDSITE_MASTER_KEY: ${CLOUDSITE_MASTER_KEY:-}
      CLOUDSITE_DATA_DIR: /data
      CLOUDSITE_WORKER_QUEUE: ${CLOUDSITE_WORKER_QUEUE:-default}
      CLOUDSITE_WORKER_POLL_INTERVAL: ${CLOUDSITE_WORKER_POLL_INTERVAL:-2.0}
      CLOUDSITE_WORKER_MAX_CONCURRENT: ${CLOUDSITE_WORKER_MAX_CONCURRENT:-4}
      CLOUDSITE_INDEXING_ENGINE: ${CLOUDSITE_INDEXING_ENGINE:-v1}
    volumes:
      - ${CLOUDSITE_DATA_PATH:-./data}:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudsite-internal