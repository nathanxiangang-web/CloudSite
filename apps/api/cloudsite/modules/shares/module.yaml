schema_version: 1
name: "shares"
kind: "business"
migration_status: "partial"
responsibility: "Share CRUD, ticket validation, password/expiry/attempt checks, scope enforcement, share pages, and share download redirects."
public_contract: "contracts/public.py"
orm_owner: "infrastructure/models.py"

allowed_dependencies:
  - "platform/db"
  - "platform/security"
  - "platform/observability"
  - "modules/identity/contracts"
  - "modules/resources/contracts"
  - "modules/collections/contracts"

owned_tables:
  - "shares"
  - "share_verify_attempts"

forbidden_dependencies:
  - "cloudsite.main"
  - "other modules' domain/application/infrastructure/api internals"

constraints:
  - "Share tickets are stateless and must not be stored as plaintext tokens."
  - "Scope checks are mandatory for every access."
  - "Share downloads redirect; they do not proxy bytes."
  - "Do not depend on search or catalog internals."
