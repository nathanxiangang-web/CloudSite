schema_version: 1
name: "submissions"
kind: "business"
migration_status: "partial"
responsibility: "User submissions and the admin review workflow, including approval/rejection/request-changes and application of approved changes."
public_contract: "contracts/public.py"
orm_owner: "infrastructure/models.py"

allowed_dependencies:
  - "platform/db"
  - "platform/observability"
  - "modules/catalog/contracts"
  - "modules/notifications/contracts"
  - "modules/resources/contracts"
  - "modules/providers/contracts"
  - "modules/users/contracts"

owned_tables:
  - "submissions"

forbidden_dependencies:
  - "cloudsite.main"
  - "other modules' domain/application/infrastructure/api internals"

constraints:
  - "Approved changes require admin review."
  - "Users cannot review their own submissions."
  - "Store references/diffs instead of duplicating catalog state."
  - "All lifecycle transitions must follow the status machine."
