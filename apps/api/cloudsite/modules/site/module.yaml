schema_version: 1
name: "site"
kind: "business"
migration_status: "partial"
responsibility: "Site identity, public/admin text settings, registration policy, Home display limits, and share-page branding state."
public_contract: "contracts/public.py"
orm_owner: "infrastructure/models.py"

allowed_dependencies:
  - "platform/db"
  - "platform/observability"

owned_tables:
  - "site_settings"

forbidden_dependencies:
  - "cloudsite.main"
  - "other modules' domain/application/infrastructure/api internals"

constraints:
  - "Site owns site_settings persistence; app-level public composition stays outside this module."
  - "Other modules must read or update site settings only through contracts/public.py."
  - "Share image file bytes remain owned by the app-level site_assets lifecycle."
