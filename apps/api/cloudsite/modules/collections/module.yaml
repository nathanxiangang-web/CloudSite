schema_version: 1
name: "collections"
kind: "business"
migration_status: "skeleton"
responsibility: "User collections, collection items, topics, seeds, and visibility rules."
public_contract: "contracts/public.py"

allowed_dependencies:
  - "platform/db"
  - "modules/catalog/contracts"
  - "modules/identity/contracts"

owned_tables:
  - "collections"
  - "collection_items"
  - "collection topic tables"
  - "collection seed tables"

forbidden_dependencies:
  - "cloudsite.main"
  - "other modules' domain/application/infrastructure/api internals"

constraints:
  - "Reference catalog/resources by ID instead of copying metadata."
  - "Visibility checks are mandatory."
  - "Shares may depend on collections; collections must not depend on shares."
  - "Generated seeds are not auto-shared."
