schema_version: 1
name: "users"
kind: "business"
migration_status: "skeleton"
responsibility: "User accounts, authentication, sessions, admin authentication, roles/permissions, favorites, history, and playback progress."
public_contract: "contracts/public.py"

allowed_dependencies:
  - "platform/db"
  - "platform/security"
  - "platform/http"
  - "modules/identity/contracts"

owned_tables:
  - "users"
  - "user_sessions"
  - "admin_sessions"
  - "user_favorites"
  - "user_resource_history"
  - "user_playback_progress"

forbidden_dependencies:
  - "cloudsite.main"
  - "other modules' domain/application/infrastructure/api internals"

constraints:
  - "Use opaque server-side sessions, not JWT session state."
  - "Admin and user sessions remain separate."
  - "Do not depend on catalog or shares internals."
  - "Never expose or log password hashes."
