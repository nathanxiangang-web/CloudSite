schema_version: 1
name: "presentation"
kind: "business"
migration_status: "partial"
responsibility: "Site presentation presets, theme/navigation/home-block configuration, revision history, rollback, and public presentation projection."
public_contract: "contracts/public.py"
orm_owner: "infrastructure/models.py"

allowed_dependencies:
  - "platform/db"
  - "platform/observability"

owned_tables:
  - "site_presentation"
  - "site_presentation_revisions"

forbidden_dependencies:
  - "cloudsite.main"
  - "other modules' domain/application/infrastructure/api internals"

constraints:
  - "Stored presentation configuration must be schema-validated before use."
  - "Rollback appends history; it must not erase prior revisions."
  - "Presentation config contains data only and must never execute user code."
  - "Other modules consume presentation state only through contracts/public.py."
