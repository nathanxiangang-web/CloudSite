[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsite-api"
version = "2.0.0-alpha.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "tenacity>=9.1,<10",
  "cryptography>=49,<51",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cloudsite*"]
exclude = ["tests*"]

# requirements.lock is generated by:
#   uv pip compile pyproject.toml -o requirements.lock --python-version 3.12
# Regenerate after changing dependencies.
